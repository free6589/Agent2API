[package]
name = "free-wenxin"
description = "Agent2API 免费提供商插件：百度文心（千帆 API）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "free-wenxin"
path = "src/main.rs"

[dependencies]
agent2api-provider-protocol = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.4.0" }
agent2api-provider-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", tag = "v3.4.0" }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
md-5 = "0.10"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
