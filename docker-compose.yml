# Agent2API 部署（单容器：默认一个 3065 端口，既是管理面板也是 OpenAI 兼容网关）。
#
#   docker compose up -d --build
#
#   面板     http://<主机>:3065    （首次打开注册管理员账号，之后账号密码登录）
#   网关     http://<主机>:3065/v1 （API Key 在面板「网关 Key」页创建；OpenAI 兼容）
#
# 镜像名、容器名、端口绑定与运行用户都可以用变量覆盖（写进 .env 即可，
# 与 docker compose 的变量替换同一套规则）。默认值与安装文档的口径一致。
#
# 可选：只绑本机回环（不想把面板和网关暴露到局域网/公网时）——在 .env 里
# 设置 AGENT2API_BIND_ADDRESS=127.0.0.1，并自行配置防火墙；需要局域网/公网
# 访问时保持默认或显式设 0.0.0.0。只给网关开公网时，建议把面板分到另一个
# 仅回环的端口。
#
# 可选：面板分端口（AGENT2API_PANEL_PORT）——设置后管理面（界面 + /api/*）
# 单独监听该端口，主端口只保留 /v1/* 网关。想把面板留在内网时：在 .env 里
# 设置 AGENT2API_PANEL_PORT=3066，然后只映射网关端口：
#
#   ports:
#     - "${AGENT2API_BIND_ADDRESS:-0.0.0.0}:${AGENT2API_HOST_PORT:-3065}:3065"    # 网关（/v1/*）
#     - "127.0.0.1:3066:3066"   # 面板：只绑本机回环，不暴露公网
#
# 数据全部落在 ./data 一个卷里。

services:
  agent2api:
    build: .
    image: ${AGENT2API_IMAGE:-agent2api:local}
    container_name: ${AGENT2API_CONTAINER_NAME:-agent2api}
    restart: unless-stopped
    # 运行用户：默认 root（兼容容器内自更新，与上游安装文档口径一致）。
    # 本机部署建议在 .env 设置自己的 UID/GID（如 AGENT2API_UID=1000、
    # AGENT2API_GID=1000）——**先 `chown -R <UID>:<GID> ./data` 再启动**，
    # 否则容器内的 root 建过库之后非 root 用户读不了。AGENT2API_SELF_UPDATE
    # 依赖写入容器内文件，非 root 时请把它设为 0。
    user: "${AGENT2API_UID:-0}:${AGENT2API_GID:-0}"
    # 可选：给容器设内存上限。超限时内核杀掉进程，再由上面的 restart 策略拉起 ——
    # 表现为「重启一次」，而不是把宿主机（或同机其它服务）拖垮。小内存机器
    # （512M~1G 的 VPS / NAS）建议开，按实际并发量从 1g 起调。
    #   普通 `docker compose` 用 mem_limit：
    # mem_limit: 1g
    #   swarm / `docker compose --compatibility` 用 deploy 的形式：
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g
    ports:
      # 绑定地址与宿主端口都可配（见文件头说明）；容器内恒为 3065。
      - "${AGENT2API_BIND_ADDRESS:-0.0.0.0}:${AGENT2API_HOST_PORT:-3065}:3065"
    environment:
      # 面板管理员：可选。不设时走登录页注册（首次打开面板即提示）；
      # 无人值守 / IaC 部署才需要在这里预置（密码明文填，启动时自动
      # 转 bcrypt 哈希，库里只存哈希）。
      AGENT2API_ADMIN_USER: ${AGENT2API_ADMIN_USER:-}
      AGENT2API_ADMIN_PASSWORD: ${AGENT2API_ADMIN_PASSWORD:-}
      # 可选：预置第一把网关 API Key（无人值守部署用）；不设则先在面板
      # 「网关 Key」页创建，创建前 /v1/* 为 fail-closed。这是网关读取的
      # 环境变量（server/config/parse.rs），不是只给 compose 用的。
      AGENT2API_PROXY_API_KEY: ${AGENT2API_PROXY_API_KEY:-}
      # 可选：面板分端口（见文件头说明）。不设则面板与网关同在 3065。
      AGENT2API_PANEL_PORT: ${AGENT2API_PANEL_PORT:-}
      # 登录页人机验证组件环境变量，默认为1开启，0为关闭
      AGENT2API_CAPTCHA_ENABLED: ${AGENT2API_CAPTCHA_ENABLED:-1}
      # 可选：AGENT2API_VERBOSE / AGENT2API_ALLOW_NO_KEY / AGENT2API_PROXY_PORT
      # 容器内更新入口（面板「设置 → 软件更新」一键下载并替换）：镜像里默认 1 开启，
      # 置 0 关闭。注意它替换的是容器里的文件，compose 里的镜像标签不变 —— 见 README「升级」。
      AGENT2API_SELF_UPDATE: ${AGENT2API_SELF_UPDATE:-1}
      # 可选：两处常驻内存图片缓存的上限（MiB），默认各 128。小内存机器可调小；
      # 写坏 / 越界会回落默认值，不会让服务起不来（详见 install 文档）。
      # AGENT2API_IMAGE_CACHE_MB: "64"
      # AGENT2API_IMAGE_COMPRESS_CACHE_MB: "64"
    volumes:
      # 全部状态（SQLite 库、配置、日志）都在这一个卷里
      - ./data:/data
